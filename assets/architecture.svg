<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <style>
    .box{fill:#161b22;stroke:#30363d;rx:8}
    .grp{fill:#0d1117;stroke:#21262d;stroke-dasharray:4 3}
    .lbl{fill:#e6edf3;font-size:13px;font-weight:600}
    .sub{fill:#8b949e;font-size:10.5px}
    .edge{stroke:#8b949e;stroke-width:1.4;fill:none;marker-end:url(#arr)}
    .etext{fill:#a5b1bd;font-size:10px}
    .pub{stroke:#3fb950}
    .warn{stroke:#d29922}
  </style>
  <rect width="960" height="600" fill="#010409"/>

  <!-- Internet -->
  <rect x="20" y="250" width="110" height="56" rx="8" class="box"/>
  <text x="75" y="275" text-anchor="middle" class="lbl">Internet</text>
  <text x="75" y="291" text-anchor="middle" class="sub">visitors</text>

  <!-- Funnel -->
  <rect x="170" y="240" width="150" height="76" rx="8" class="box pub"/>
  <text x="245" y="266" text-anchor="middle" class="lbl">Tailscale Funnel</text>
  <text x="245" y="282" text-anchor="middle" class="sub">public TLS edge</text>
  <text x="245" y="297" text-anchor="middle" class="sub">single route only</text>

  <!-- Caddy -->
  <rect x="370" y="215" width="160" height="126" rx="8" class="box"/>
  <text x="450" y="240" text-anchor="middle" class="lbl">Caddy</text>
  <text x="450" y="256" text-anchor="middle" class="sub">reverse proxy</text>
  <rect x="382" y="266" width="136" height="30" rx="5" fill="#12261e" stroke="#3fb950"/>
  <text x="450" y="285" text-anchor="middle" class="sub" fill="#7ee2b8">public :8899 status-only</text>
  <rect x="382" y="301" width="136" height="30" rx="5" fill="#1f1a10" stroke="#d29922"/>
  <text x="450" y="320" text-anchor="middle" class="sub">LAN :80 internal routes</text>

  <!-- Status page -->
  <rect x="586" y="222" width="150" height="52" rx="8" class="box pub"/>
  <text x="661" y="244" text-anchor="middle" class="lbl">Uptime Kuma</text>
  <text x="661" y="260" text-anchor="middle" class="sub">curated status page</text>
  <line x1="530" y1="248" x2="582" y2="248" class="edge"/>
  <line x1="320" y1="270" x2="366" y2="258" class="edge"/>

  <!-- Private services group -->
  <rect x="586" y="300" width="354" height="120" rx="8" class="box grp"/>
  <text x="600" y="322" class="sub">private workloads — 21 containers, LAN-only</text>
  <g class="sub" fill="#c9d1d9">
    <rect x="600" y="332" width="100" height="34" rx="5" class="box"/><text x="650" y="353" text-anchor="middle">media stack</text>
    <rect x="712" y="332" width="100" height="34" rx="5" class="box"/><text x="762" y="353" text-anchor="middle">automation</text>
    <rect x="824" y="332" width="100" height="34" rx="5" class="box"/><text x="874" y="353" text-anchor="middle">Vaultwarden</text>
    <rect x="600" y="374" width="100" height="34" rx="5" class="box"/><text x="650" y="395" text-anchor="middle">Grafana</text>
    <rect x="712" y="374" width="100" height="34" rx="5" class="box"/><text x="762" y="395" text-anchor="middle">Prometheus</text>
    <rect x="824" y="374" width="100" height="34" rx="5" class="box"/><text x="874" y="395" text-anchor="middle">exporters</text>
  </g>
  <line x1="450" y1="341" x2="582" y2="360" class="edge" stroke-dasharray="5 3"/>
  <text x="505" y="345" class="etext">LAN only</text>

  <!-- GitOps lane -->
  <rect x="20" y="40" width="420" height="140" rx="8" class="box grp"/>
  <text x="36" y="64" class="sub">GitOps — pull-based, no inbound</text>
  <rect x="36" y="78" width="180" height="72" rx="8" class="box"/>
  <text x="126" y="102" text-anchor="middle" class="lbl">GitHub · homelab</text>
  <text x="126" y="118" text-anchor="middle" class="sub">compose + k8s manifests</text>
  <text x="126" y="133" text-anchor="middle" class="sub">SLO defs, runbooks, postmortems</text>
  <rect x="256" y="78" width="168" height="72" rx="8" class="box"/>
  <text x="340" y="98" text-anchor="middle" class="lbl">systemd timer</text>
  <text x="340" y="114" text-anchor="middle" class="sub">polls every 5 min</text>
  <text x="340" y="130" text-anchor="middle" class="sub">git fetch → compose up -d</text>
  <line x1="218" y1="114" x2="252" y2="114" class="edge"/>
  <text x="235" y="106" class="etext" text-anchor="middle">git pull</text>
  <line x1="340" y1="152" x2="340" y2="188" class="edge"/>
  <line x1="340" y1="188" x2="430" y2="210" class="edge"/>
  <text x="395" y="185" class="etext">applies state</text>

  <!-- Snapshot lane -->
  <rect x="500" y="462" width="440" height="112" rx="8" class="box grp"/>
  <text x="516" y="486" class="sub">static evidence loop — Grafana never exposed</text>
  <rect x="516" y="496" width="190" height="62" rx="8" class="box"/>
  <text x="611" y="520" text-anchor="middle" class="lbl">daily exporter</text>
  <text x="611" y="536" text-anchor="middle" class="sub">systemd timer renders PromQL</text>
  <text x="611" y="550" text-anchor="middle" class="sub">→ PNG snapshots</text>
  <rect x="750" y="496" width="174" height="62" rx="8" class="box"/>
  <text x="837" y="520" text-anchor="middle" class="lbl">repo images/</text>
 <text x="837" y="536" text-anchor="middle" class="sub">committed evidence for</text>
  <text x="837" y="550" text-anchor="middle" class="sub">the case study</text>
  <line x1="708" y1="527" x2="746" y2="527" class="edge"/>
  <line x1="762" y1="460" x2="762" y2="430" class="edge" stroke-dasharray="5 3"/>

  <!-- Hardware footer -->
  <rect x="20" y="462" width="440" height="112" rx="8" class="box"/>
  <text x="36" y="488" class="lbl">HP Compaq 8300 SFF</text>
  <text x="36" y="508" class="sub">Intel i3-3220 · 2C/4T @ 3.3 GHz</text>
  <text x="36" y="524" class="sub">3.7 GiB RAM · 2 GiB swapfile · swappiness 10</text>
  <text x="36" y="540" class="sub">$0/month · all workloads memory-capped in compose</text>
  <text x="36" y="556" class="sub">alert: MemAvailable &lt; 1 GiB AND swap trending up</text>

  <text x="480" y="592" text-anchor="middle" class="sub">single-node homelab · everything defined in git · nothing GitHub-side reaches into the box</text>
</svg>
